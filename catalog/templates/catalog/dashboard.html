<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Dashboard</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        h1 { border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        
        .nav { margin-bottom: 20px; display: flex; gap: 15px; }
        .nav a { text-decoration: none; color: #007bff; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        
        .btn-delete { 
            background-color: #dc3545; color: white; border: none; 
            padding: 5px 10px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px;
        }
        .btn-delete:hover { background-color: #c82333; }
        .empty-msg { text-align: center; color: #666; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="nav">
        <a href="/catalog/search/">🔍 Search</a>
        <a href="/catalog/upload/">📤 Upload Book</a>
        <span>📊 Dashboard</span>
    </div>

    <h1>📚 Library Manager</h1>

    {% if books %}
        <table>
            <thead>
                <tr>
                    <th>Filename</th>
                    <th>Pages</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for book in books %}
                <tr>
                    <td>
                        <a href="/media/{{ book.filename }}" target="_blank" style="color: #333; font-weight: bold;">
                            {{ book.filename }}
                        </a>
                    </td>
                    <td>{{ book.total_pages }}</td>
                    <td>
                        <a href="{% url 'delete_book' book.filename %}" 
                           class="btn-delete"
                           onclick="return confirm('Are you sure you want to delete this book?');">
                           🗑 Delete
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <div class="empty-msg">
            <h3>Your library is empty.</h3>
            <p>Go to the Upload page to add your first book!</p>
        </div>
    {% endif %}

</body>
</html>
